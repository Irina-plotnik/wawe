<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>W-Wave</title>
        <link rel="icon" href="/images/icons/favicon.png">
        <link rel="stylesheet" href="css/normalize.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/media.css">
        <link rel="stylesheet" href="css/header.css">
        <link rel="stylesheet" href="css/hero.css">
    </head>

    <body>
        <header class="header">
            <div class="container header__container">
                <a href="#" class="header__logo">
                    <img src="/images/logo.svg" alt="Радио W-Wave">
                </a>

                <nav class="header__nav">
                    <ul class="nav__list list-reset">
                        <li class="nav__item">
                            <a href="#podcasts" class="btn-reset nav__link">
                                Подкасты
                            </a>
                        </li>

                        <li class="nav__item">
                            <a href="#transmissions" class="btn-reset nav__link">
                                Передачи
                            </a>
                        </li>

                        <li class="nav__item">
                            <a href="#guests" class="btn-reset nav__link">
                                Гости
                            </a>
                        </li>

                        <li class="nav__item">
                            <a href="#playlists" class="btn-reset nav__link">
                                Плейлисты
                            </a>
                        </li>

                        <li class="nav__item">
                            <a href="#about-Us" class="btn-reset nav__link">
                                О&nbsp;нас
                            </a>
                        </li>
                    </ul>

                    <div class="header__search">
                        <a href="#" class="btn-reset header__search-link">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg">

                                <path
                                    d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z"
                                    stroke="currentColor"
                                    stroke-width="2"
                                />

                                <path
                                    d="M21 21L16.65 16.65"
                                    stroke="currentColor"
                                    stroke-width="2"
                                />
                            </svg>
                        </a>
                    </div>
            </div>
        </header>

        <main class="main">
            <section class="hero section">
                <div class="container hero__container">
                    <div class="hero__wrap">
                        <div class="hero__content">
                            <h1 class="hero__title">
                                <span class="hero__title-start">Радио&nbsp;</span>
                                <span class="hero__title-finish">W-Wave</span>
                            </h1>

                            <span class="hero__descr descr">
                                Привет, на&nbsp;связи W-Wave! Раньше мы&nbsp;были изданием, а&nbsp;теперь пробуем себя в&nbsp;разоворном жанре. Говорим о&nbsp;музыке, политике, истории, науке и&nbsp;культуре. Здесь, помимо прямого эфира&nbsp;&mdash; архив передач и&nbsp;многое другое:)
                            </span>
                        </div>

                        <button
                            type="button"
                            class="hero__btn btn-reset"
                        >
                            Слушать эфир
                        </button>
                    </div>

                    <img
                        class="hero__img"
                        src="images/hero-img.png"
                        alt="микрофон"
                    >
                </div>
            </section>

        </main>
    </body>
</html>
